services:
  # ---------------------------------------------------------
  # 1. API GATEWAY (Public Web Service)
  # ---------------------------------------------------------
  - type: web
    name: cldx-gateway
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd gateway && npm install
    startCommand: cd gateway && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: REDIS_URL
        fromService:
          type: redis
          name: cldx-redis
          property: connectionString
      - key: AUTH_SERVICE
        fromService:
          type: web
          name: cldx-auth
          property: host
      - key: CHAT_SERVICE
        fromService:
          type: web
          name: cldx-chat
          property: host
      - key: AGENT_SERVICE
        fromService:
          type: web
          name: cldx-agent
          property: host
      - key: BILLING_SERVICE
        fromService:
          type: web
          name: cldx-billing
          property: host

  # ---------------------------------------------------------
  # 2. AUTH SERVICE (Web Service)
  # ---------------------------------------------------------
  - type: web
    name: cldx-auth
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd services/auth && npm install
    startCommand: cd services/auth && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: REDIS_URL
        fromService:
          type: redis
          name: cldx-redis
          property: connectionString
      - key: MONGODB_URL
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: cldx-frontend
          property: host
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

  # ---------------------------------------------------------
  # 3. CHAT SERVICE (Web Service)
  # ---------------------------------------------------------
  - type: web
    name: cldx-chat
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd services/chat && npm install
    startCommand: cd services/chat && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false

  # ---------------------------------------------------------
  # 4. AGENT SERVICE (Web Service)
  # ---------------------------------------------------------
  - type: web
    name: cldx-agent
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd services/agent && npm install
    startCommand: cd services/agent && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: REDIS_URL
        fromService:
          type: redis
          name: cldx-redis
          property: connectionString
      - key: MONGODB_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: CHAT_SERVICE
        fromService:
          type: web
          name: cldx-chat
          property: host
      - key: AUTH_SERVICE
        fromService:
          type: web
          name: cldx-auth
          property: host
      - key: GATEWAY_URL
        fromService:
          type: web
          name: cldx-gateway
          property: host

  # ---------------------------------------------------------
  # 5. BILLING SERVICE (Web Service)
  # ---------------------------------------------------------
  - type: web
    name: cldx-billing
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd services/billing && npm install
    startCommand: cd services/billing && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false
      - key: AUTH_SERVICE
        fromService:
          type: web
          name: cldx-auth
          property: host
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # ---------------------------------------------------------
  # 6. FRONTEND (Static Site)
  # ---------------------------------------------------------
  - type: web
    name: cldx-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: cldx-gateway
          property: host
      - key: VITE_RAZORPAY_KEY
        sync: false

  # ---------------------------------------------------------
  # 7. REDIS (Managed Cache)
  # ---------------------------------------------------------
  - type: redis
    name: cldx-redis
    plan: free
    maxmemoryPolicy: noeviction
