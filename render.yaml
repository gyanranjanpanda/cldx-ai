services:
  # ---------------------------------------------------------
  # 1. API GATEWAY
  # ---------------------------------------------------------
  - type: web
    name: cldx-gateway
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd gateway && npm install
    startCommand: cd gateway && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cldx-redis
          property: connectionString
      - key: AUTH_SERVICE
        fromService:
          type: web
          name: cldx-auth
          property: host
      - key: CHAT_SERVICE
        fromService:
          type: web
          name: cldx-chat
          property: host
      - key: AGENT_SERVICE
        fromService:
          type: web
          name: cldx-agent
          property: host
      - key: BILLING_SERVICE
        fromService:
          type: web
          name: cldx-billing
          property: host

